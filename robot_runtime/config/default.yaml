backend: real

# Real arm CAN connection (official pyAgxArm SDK)
can_channel: can0
can_interface: socketcan
can_bitrate: 1000000
pyagxarm_repo: ../../vendor/pyAgxArm

# Official CAN script path (used by `can check` / `can hint-up`)
can_tools:
  scripts_dir: ../../vendor/pyAgxArm/pyAgxArm/scripts/ubuntu

# Runtime
waypoint_file: ./waypoints.yaml
move_timeout_sec: 30.0
move_reach_tolerance_deg: 2.5
move_done_tolerance_deg: 4.0
move_min_progress_deg: 0.2
move_reach_stable_cycles: 1
final_step_confirm: true

logging:
  enabled: true
  level: INFO
  dir: ./logs
  per_run_file: true
  filename_prefix: nero_test
  retain_runs: 30
  capture_stdout: true
  capture_stderr: true
  log_commands: true
  feedback_csv_interval_sec: 5.0

# Motion safety
speed_percent: 50
joint_limits_margin: 0.0
jog_step_rad: 0.05

safety:
  speed_percent_default: 10
  enforce_joint_limit_clamp: true
  warn_on_clamp: true
  max_joint_step_deg: 90

joint_limits:
  joint1: [-2.705261, 2.705261]
  joint2: [-1.745330, 1.745330]
  joint3: [-2.757621, 2.757621]
  joint4: [-1.012291, 2.146755]
  joint5: [-2.757621, 2.757621]
  joint6: [-0.733039, 0.959932]
  joint7: [-1.570797, 1.570797]

# Folded standby pose
home_joints: [0.0, -0.6109, 1.0472, -0.9076, 0.0, 0.2793, 0.0]

gripper:
  type: agx_gripper
  open_width: 0.10
  close_width: 0.04
  force: 1.0
  dwell_sec: 0.8

joint_test:
  delta_deg: 3.0
  dwell_sec: 0.3
  joints: [j1, j2, j3, j4, j5, j6]

# User-requested 5-step route (prepick derived from pick +50mm Z):
# ready -> open -> prepick -> pick -> close -> ready -> transport -> dump -> open -> transport -> ready
threepoint:
  # Keep orientation flexible to reduce IK singularity/no-solution risk.
  strict_down_enabled: false
  lock_orientation_from: pick
  execution_profile: joint_first
  transfer_motion: p
  approach_motion: p
  orientation_tolerance_deg: 5.0
  min_joint7_deg: 10.0

  overwrite_waypoints_on_start: true

  ready:
    joints_deg: [9.179, 10.290, -5.627, 100.002, -0.001, 0.000, 70.002]
    pose_mm_deg:
      x: -307.027
      y: -20.185
      z: 174.635
      rx: -166.267
      ry: -88.966
      rz: -100.092

  pick:
    joints_deg: [3.943, 84.599, -0.792, 46.951, 2.251, 2.646, 54.694]
    pose_mm_deg:
      x: -490.641
      y: -29.653
      z: -185.828
      rx: -97.847
      ry: -83.695
      rz: -171.804

  transport:
    joints_deg: [93.469, 6.697, -5.667, 99.769, 0.187, 0.021, 70.579]
    pose_mm_deg:
      x: -10.288
      y: -303.900
      z: 194.754
      rx: 99.245
      ry: -86.971
      rz: 78.534

  dump:
    joints_deg: [119.663, -2.085, 60.604, 99.766, -0.082, 0.021, 70.587]
    pose_mm_deg:
      x: 293.713
      y: 4.104
      z: 234.899
      rx: 100.160
      ry: -79.163
      rz: 170.261

task:
  save_closed_state_waypoint: grip_closed_at_pick
