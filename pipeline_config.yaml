        z: 234.899
        rx: 100.160
        ry: -79.163
        rz: 170.261
  task:
    save_closed_state_waypoint: grip_closed_at_pick
auto_enable:
  can_channel: can0
  can_bitrate: 1000000
  can_interface: socketcan
  usb_bus_info: 1-2.2:1.0
  can_scripts_dir: ./vendor/pyAgxArm/pyAgxArm/scripts/ubuntu
  retry_interval_sec: 2.0
  enable_timeout_sec: 12.0
  health_check_sec: 1.0
